id = "herdr-sync-panes"
name = "Sync Panes"
version = "1.2.0"
min_herdr_version = "0.9.5"
description = "Broadcast terminal input from a control pane to the current tab"
platforms = ["linux"]

[[build]]
command = ["sh", "scripts/install-release.sh"]

[[actions]]
id = "start"
title = "Start pane synchronization"
contexts = ["pane"]
command = ["./bin/herdr-sync-panes", "open"]

[[panes]]
id = "control"
title = "SYNC"
placement = "popup"
width = 11
height = 4
command = ["./bin/herdr-sync-panes", "sync"]
